name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-panel/pnpm-lock.yaml

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration ${{ inputs.configuration }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-${{ inputs.configuration }}
          path: WandEnhancer/bin/${{ inputs.configuration }}/
          if-no-files-found: error
